project:
  type: website
  output-dir: _site
  post-render:
    - scripts/check-generated-html.py

# Quarto 1.3 generated MathJax pages that loaded the compromised polyfill.io
# service. Refuse older renderers so local builds cannot silently reintroduce it.
quarto-required: ">=1.9.38"

website:
  title: "Posts by Rito Ghosh"
  site-url: https://ritog.github.io
  search: true
  comments:
    utterances:
      repo: ritog/ritog.github.io
      label: comment-utter
      theme: github-dark
  navbar:
    right:
      - about.qmd
      - now.qmd
      - cv.qmd
      - publications.qmd
      - text: "{{< iconify fa6-brands github >}}"
        href: https://github.com/ritog
      - text: "{{< iconify fa6-brands x-twitter >}}"
        href: https://twitter.com/AllesistKode
      - text: "{{< iconify fa6-brands google-scholar >}}"
        href: https://scholar.google.com/citations?user=R_X74h0AAAAJ
      - text: "{{< iconify fa6-brands mastodon >}}"
        href: https://mathstodon.xyz/@rg
        rel: me
      - text: "{{< iconify fa6-brands linkedin >}}"
        href: https://linkedin.com/in/ritobrata-ghosh
      - icon: rss
        href: index.xml
    left:
      - TILs_index.qmd
format:
  html:
    theme:
      dark: solar
      light: lumen
    monofont: "Cascadia Code"
    css: styles.css
    anchor-sections: true
    mainfont: "IBM Plex Mono"
    code-line-numbers: true
    code-copy: true
    # KaTeX avoids the legacy MathJax template that referenced polyfill.io.
    # Pin the CDN version so future renders do not silently change dependencies.
    html-math-method:
      method: katex
      url: "https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/"


execute:
    freeze: auto
